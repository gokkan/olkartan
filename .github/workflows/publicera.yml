name: Bygg och publicera

on:
  push:
    branches: [main]
  # Söndag 04:10 svensk tid. Källan uppdateras 03:00, så datan hunnit landa.
  # Cron i GitHub Actions går i UTC och tar ingen hänsyn till sommartid;
  # 02:10 UTC blir 04:10 på sommaren och 03:10 på vintern. Det spelar ingen
  # roll här — sortimentet ändras långsamt.
  schedule:
    - cron: '10 2 * * 0'
  workflow_dispatch: # gör det möjligt att trycka på knappen manuellt

permissions:
  contents: read
  pages: write
  id-token: write

# Låt en pågående publicering bli klar istället för att avbrytas.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  bygg:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Enhetstesterna för likhetsmotorn tar en halv sekund och behöver ingen
      # webbläsare. Går de sönder ska bygget stanna, inte publiceras.
      - run: npm test

      # Råfilen är 100 MB och hämtas från en privatpersons server, så bara ett
      # jobb i veckan hämtar den. Pushar återanvänder veckans cache.
      #
      # Cachen läses inte alls av det schemalagda jobbet — det är hela dess
      # uppgift att hämta nytt. Första söndagskörningen gjorde inte det:
      # isoveckor börjar på måndag, så söndagen är veckans sista dag och delade
      # nyckel med varje push sedan måndagen. Jobbet fick träff, hoppade över
      # hämtningen och publicerade gårdagens data. Nyckeln som sparas är därför
      # *nästa* veckas — den vecka pushar kommer att fråga efter.
      #
      # Manuell körning räknas som schemalagd. Trycker man på knappen vill man
      # ha färsk data, annars hade man pushat.
      - name: Cachenycklar
        id: cache
        run: |
          echo "las=sortiment-$(date -u +%G-%V)" >> "$GITHUB_OUTPUT"
          if [ "${{ github.event_name }}" = push ]; then
            echo "skriv=sortiment-$(date -u +%G-%V)" >> "$GITHUB_OUTPUT"
          else
            echo "skriv=sortiment-$(date -u -d tomorrow +%G-%V)" >> "$GITHUB_OUTPUT"
          fi

      - name: Läs cachen
        id: las
        if: github.event_name == 'push'
        uses: actions/cache/restore@v4
        with:
          path: data/rå
          key: ${{ steps.cache.outputs.las }}
          # Faller tillbaka på förra veckans fil hellre än att hämta 100 MB en
          # gång per push. Är den äldre än sju dygn hämtar skriptet ändå.
          restore-keys: sortiment-

      - name: Hämta sortimentet
        run: npm run data:hämta

      - name: Spara cachen
        if: github.event_name != 'push' || steps.las.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: data/rå
          key: ${{ steps.cache.outputs.skriv }}

      - name: Bygg datan
        # Råfilen är 100 MB JSON. Heapen räcker med standardinställningen på en
        # vanlig körare, men sätts explicit så att bygget inte beror på hur
        # mycket minne körarbilden råkar ha.
        env:
          NODE_OPTIONS: --max-old-space-size=4096
        run: npm run data

      # Enhetstesterna körs här och inte tidigare, för de som betyder något
      # läser den byggda datan. Kartorna som publiceras byggs av det sortiment
      # jobbet just hämtat, inte av filen i repot — testar man före bygget
      # granskar man en kopia som aldrig når någon.
      - name: Testa den byggda datan
        run: npm test

      - name: Bygg appen
        env:
          BASE: /${{ github.event.repository.name }}/
        run: npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  publicera:
    needs: bygg
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
